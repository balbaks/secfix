[project]
name = "secfix"
version = "0.1.0"
description = "SQL-injection finding validator and auto-patcher for authorized Python codebases"
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.0",
]

[project.scripts]
secfix = "secfix.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["secfix*"]
